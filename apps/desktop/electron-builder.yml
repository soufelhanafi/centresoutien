appId: com.centresoutien.desktop
productName: Centre Soutien
copyright: Copyright © 2026 Centre Soutien

directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - package.json

# better-sqlite3-multiple-ciphers ships a platform-specific .node binary that
# cannot execute from inside the asar archive, so its package is unpacked to
# app.asar.unpacked at build time. Password hashing uses hash-wasm (pure
# WebAssembly, bundled into the JS) — no native binary to unpack.
asarUnpack:
  - '**/node_modules/better-sqlite3-multiple-ciphers/**/*'

# Native binary is rebuilt for the Electron ABI by predist (native-abi.mjs)
# before electron-builder runs — its own rebuild pass would target the wrong
# ABI and is redundant.
npmRebuild: false

mac:
  category: public.app-category.education
  icon: build/icon.png
  # Native module (better-sqlite3-multiple-ciphers) is compiled/fetched for one
  # arch per runner. CI builds separate arm64 and x64 dmg artifacts instead of a
  # universal binary — see PACKAGING.md.
  target:
    - target: dmg
  # No paid Developer ID cert yet (SOU-86 KICKOFF: deferred to a follow-up).
  # Explicitly disables signing rather than letting electron-builder pick up
  # an unrelated cert it finds in the local keychain. See PACKAGING.md for the
  # optional self-signed dev cert path and the Gatekeeper workaround.
  identity: null

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
