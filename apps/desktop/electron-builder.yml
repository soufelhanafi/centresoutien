appId: com.centresoutien.desktop
productName: Centre Soutien
copyright: Copyright © 2026 Centre Soutien

directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - package.json

# better-sqlite3-multiple-ciphers and @node-rs/argon2 ship platform-specific
# .node binaries — these cannot execute from inside the asar archive, so their
# packages are unpacked to app.asar.unpacked at build time.
asarUnpack:
  - '**/node_modules/better-sqlite3-multiple-ciphers/**/*'
  - '**/node_modules/@node-rs/argon2*/**/*'

# Native binary is rebuilt for the Electron ABI by predist (native-abi.mjs)
# before electron-builder runs — its own rebuild pass would target the wrong
# ABI and is redundant.
npmRebuild: false

mac:
  category: public.app-category.education
  icon: build/icon.png
  # arm64 only: native modules (better-sqlite3-multiple-ciphers, @node-rs/argon2)
  # are compiled/fetched for the build machine's own arch, so a single run
  # cannot correctly produce both a x64 and an arm64 dmg — see PACKAGING.md.
  # CI builds each platform on its own runner (.github/workflows/package.yml).
  target:
    - target: dmg
      arch:
        - arm64
  # No paid Developer ID cert yet (SOU-86 KICKOFF: deferred to a follow-up).
  # Explicitly disables signing rather than letting electron-builder pick up
  # an unrelated cert it finds in the local keychain. See PACKAGING.md for the
  # optional self-signed dev cert path and the Gatekeeper workaround.
  identity: null

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
