name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.9.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # CLAUDE.md §9 gate order — fail fast, one step at a time.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Pre-merge grep gates
        run: pnpm gate

      - name: Build desktop
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.9.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build desktop
        run: pnpm --filter @centresoutien/desktop build

      # Runner is this machine's real display (macOS, no Xvfb equivalent) —
      # CS_E2E_HIDDEN keeps the Electron window off-screen instead (window.ts).
      - name: E2E (Electron, FR + AR)
        run: pnpm --filter @centresoutien/desktop test:e2e:visible

      # On failure, keep the Playwright traces/screenshots so a flake or a
      # headless-only failure can be inspected without re-running locally.
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-results
          path: |
            apps/desktop/test-results/
            apps/desktop/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # visual job disabled — blocked on SOU-150 (baselines are macOS-only,
  # `*-darwin.png`, no macos-latest runner available; must regenerate as
