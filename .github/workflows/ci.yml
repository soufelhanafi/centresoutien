name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel a superseded run when new commits land on the same ref, so PRs don't
# pile up behind stale in-flight jobs (a frequent cause of runs being cancelled
# or starved on the contended macOS runner pool).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # No window/display needed for lint, typecheck, unit tests, or the builds, so
  # this runs on Linux: ~10x cheaper than macOS minutes and far shorter queue
  # times. Only the Electron E2E job below needs the macOS runner's display.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.9.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # CLAUDE.md §9 gate order — fail fast, one step at a time.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Pre-merge grep gates
        run: pnpm gate

      - name: Build desktop
        run: pnpm build

      - name: Build landing
        run: pnpm --filter @centresoutien/landing build

  e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.9.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Linux has no display, so Electron renders into a virtual framebuffer
      # (Xvfb) — the standard headless-Electron recipe. All other Chromium/GTK
      # libs are already on the ubuntu-latest image.
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # test:e2e's pretest hook builds the `--mode e2e` artifacts and rebuilds
      # the native module for the Electron ABI, so no separate build step is
      # needed. xvfb-run gives every launched Electron process a DISPLAY;
      # CS_E2E_HIDDEN still positions the window off-screen (window.ts).
      - name: E2E (Electron, FR + AR)
        run: xvfb-run -a pnpm --filter @centresoutien/desktop test:e2e

      # On failure, keep the Playwright traces/screenshots so a flake or a
      # headless-only failure can be inspected without re-running locally.
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-results
          path: |
            apps/desktop/test-results/
            apps/desktop/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # visual job disabled — blocked on SOU-150 (baselines are macOS-only,
  # `*-darwin.png`, no macos-latest runner available; must regenerate as
  # `-linux.png` via Docker and retarget to ubuntu-latest before re-enabling).
  # visual:
