name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.9.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # CLAUDE.md §9 gate order — fail fast, one step at a time.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Pre-merge grep gates
        run: pnpm gate

      - name: Build desktop
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.9.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Electron needs its GUI system libraries + a virtual display on Linux.
      - name: Install Playwright system dependencies
        run: pnpm --filter @centresoutien/desktop exec playwright install-deps

      - name: Build desktop
        run: pnpm --filter @centresoutien/desktop build

      - name: E2E (Electron under Xvfb, FR + AR)
        run: xvfb-run -a pnpm --filter @centresoutien/desktop test:e2e

      # On failure, keep the Playwright traces/screenshots so a flake or a
      # headless-only failure can be inspected without re-running locally.
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-results
          path: |
            apps/desktop/test-results/
            apps/desktop/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.9.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # This suite renders the built renderer bundle in a plain Chromium page
      # (no Electron, no native rebuild — see tests/visual/README.md), so it
      # only needs the chromium browser binary, not the full GUI dep set the
      # Electron `e2e` job installs.
      - name: Install Playwright chromium
        run: pnpm --filter @centresoutien/desktop exec playwright install --with-deps chromium

      - name: Build desktop
        run: pnpm --filter @centresoutien/desktop build

      - name: Visual regression (light/dark x FR/AR key screens)
        run: pnpm --filter @centresoutien/desktop test:visual

      # On failure, keep the actual/expected/diff triptychs so a real visual
      # regression (vs an intentional baseline update) can be told apart
      # without re-running locally.
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-results
          path: |
            apps/desktop/tests/visual/test-results/
          retention-days: 7
          if-no-files-found: ignore
