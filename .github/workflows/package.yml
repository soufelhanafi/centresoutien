name: Package

# Manual only — installers are heavy artifacts and this ticket (SOU-86) ships
# self-signed dev builds for controlled demo installs, not a public release
# channel. Each OS/arch builds on its own runner because better-sqlite3-
# multiple-ciphers and @node-rs/argon2 are native modules: their compiled
# binaries are only correct for the OS/arch that built them, so a single
# machine cannot cross-produce a working installer (see PACKAGING.md).
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub Release to centresoutien-releases (auto-update feed)'
        type: boolean
        default: false

# The bump step commits the incremented version back to the dispatched branch,
# so GITHUB_TOKEN needs contents: write on the source repo (CS_RELEASES_TOKEN
# stays scoped to the public releases repo only).
permissions:
  contents: write

# Serialize runs: a concurrent Package run would both bump from the same base
# version and race the push. Queue instead of cancel — two publishes must not
# silently drop a version.
concurrency:
  group: package-workflow
  cancel-in-progress: false

jobs:
  # SOU-248: serialize release creation. One job creates the tag + draft
  # release so the three matrix runners never race a concurrent POST /releases
  # (loser gets 422 "Published releases must have a valid tag"). electron-builder
  # uploads assets to the existing draft; finalize-release publishes it.
  init-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      # Every publish consumes the next patch version: bump apps/desktop/
      # package.json and commit it back so the repo stays the source of truth
      # and the next run increments from the bumped value. Dry runs
      # (publish=false) never consume a version.
      - name: Bump patch version (publish only)
        if: inputs.publish
        run: |
          node -e "
            const fs = require('fs');
            const p = 'apps/desktop/package.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            const [a, b, c] = j.version.split('.').map(Number);
            j.version = a + '.' + b + '.' + (c + 1);
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          "
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/package.json
          git commit -m "chore(release): bump desktop version (package workflow publish)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Resolve app version
        id: version
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create or re-draft release (publish only)
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.CS_RELEASES_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "v$VERSION" --repo soufelhanafi/centresoutien-releases >/dev/null 2>&1; then
            # Re-publishing the same version (e.g. a `gh run rerun` after finalize):
            # electron-builder configured for draft skips uploads against a published
            # release, so flip it back to draft first — finalize-release re-publishes.
            if [ "$(gh release view "v$VERSION" --repo soufelhanafi/centresoutien-releases --json isDraft --jq .isDraft)" = "false" ]; then
              gh release edit "v$VERSION" --draft=true --repo soufelhanafi/centresoutien-releases
            fi
          else
            gh release create "v$VERSION" --draft --repo soufelhanafi/centresoutien-releases
          fi

  package:
    needs: init-release
    strategy:
      # Each OS artifact is independent — a Windows-only native-module flake
      # must never cancel the already-succeeding macOS build mid-run.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac:arm64
            artifact: macos-arm64-dmg
            appDir: mac-arm64
          - os: macos-15-intel
            script: dist:mac:x64
            artifact: macos-x64-dmg
            appDir: mac
          - os: windows-latest
            script: dist:win
            artifact: windows-x64-nsis
    runs-on: ${{ matrix.os }}
    steps:
      # Ref (not the dispatch SHA): init-release pushed the bumped version to
      # the branch, and the matrix build must package that version.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9.9.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      # Windows Defender's real-time scan can hold a lock on a freshly-built
      # native .node binary just long enough for node-gyp's rebuild unlink to
      # hit EPERM — a well-known node-gyp/electron-rebuild flake on
      # windows-latest runners. Excluding the workspace avoids the race.
      - name: Exclude workspace from Windows Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"

      - run: pnpm install --frozen-lockfile

      # SOU-214: Windows Authenticode signing via SSL.com eSigner. Signing is
      # opt-in on the presence of the SSL_COM_* secrets — when they are unset the
      # installer builds unsigned (current pilot behavior) and the setup/verify
      # steps below no-op, so this workflow keeps working with no secrets.
      - name: Detect Windows signing secrets
        id: winsign
        if: runner.os == 'Windows'
        shell: bash
        env:
          SSL_COM_USERNAME: ${{ secrets.SSL_COM_USERNAME }}
        run: |
          if [ -n "$SSL_COM_USERNAME" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "::notice::SSL.com eSigner secrets present — Windows installer will be Authenticode-signed."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SSL.com eSigner secrets not set — Windows installer will be built UNSIGNED."
          fi

      - name: Set up Java for CodeSignTool
        if: runner.os == 'Windows' && steps.winsign.outputs.enabled == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up SSL.com CodeSignTool
        if: runner.os == 'Windows' && steps.winsign.outputs.enabled == 'true'
        shell: bash
        # Pin the CodeSignTool release. Verify/bump at https://github.com/SSLcom/CodeSignTool/releases
        # when activating signing — the cross-platform zip runs on the Temurin JRE above.
        env:
          CODESIGNTOOL_VERSION: v1.3.2
        run: |
          set -euo pipefail
          curl -fsSL -o codesigntool.zip \
            "https://github.com/SSLcom/CodeSignTool/releases/download/${CODESIGNTOOL_VERSION}/CodeSignTool-${CODESIGNTOOL_VERSION}.zip"
          mkdir -p "$RUNNER_TEMP/codesigntool"
          unzip -q codesigntool.zip -d "$RUNNER_TEMP/codesigntool"
          # Some releases nest the tool one folder deep; locate the launcher and
          # export its directory for the electron-builder sign hook.
          DIR=$(find "$RUNNER_TEMP/codesigntool" -maxdepth 2 -name 'CodeSignTool.bat' -printf '%h\n' | head -1)
          if [ -z "$DIR" ]; then
            echo "CodeSignTool.bat not found in the extracted archive" >&2
            exit 1
          fi
          echo "CODESIGNTOOL_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Package (${{ matrix.artifact }})
        env:
          GH_TOKEN: ${{ inputs.publish && secrets.CS_RELEASES_TOKEN || '' }}
          # Consumed by apps/desktop/build/sign-windows.cjs. Empty on non-Windows
          # runners and when the secrets are unset — the hook stays a no-op then.
          SSL_COM_USERNAME: ${{ secrets.SSL_COM_USERNAME }}
          SSL_COM_PASSWORD: ${{ secrets.SSL_COM_PASSWORD }}
          SSL_COM_CREDENTIAL_ID: ${{ secrets.SSL_COM_CREDENTIAL_ID }}
          SSL_COM_TOTP_SECRET: ${{ secrets.SSL_COM_TOTP_SECRET }}
        run: pnpm --filter @centresoutien/desktop ${{ matrix.script }} --publish ${{ inputs.publish && 'always' || 'never' }}

      # Fail the publish if signing was expected but the installer is not
      # validly signed — an unsigned installer must never masquerade as signed.
      - name: Verify Authenticode signature (Windows)
        if: runner.os == 'Windows' && steps.winsign.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/desktop/dist/*.exe | Select-Object -First 1
          if ($null -eq $installer) { throw "No installer .exe found to verify" }
          $sig = Get-AuthenticodeSignature $installer.FullName
          Write-Host "Installer: $($installer.Name)"
          Write-Host "Signature status: $($sig.Status)"
          if ($sig.Status -ne 'Valid') { throw "Installer is not validly signed (status: $($sig.Status))" }
          Write-Host "Signed by: $($sig.SignerCertificate.Subject)"

      # A green `electron-builder` exit code only proves packaging didn't
      # throw — it does NOT prove the native modules it bundled actually
      # load (SOU-86: @node-rs/argon2 packaged fine but threw "Failed to
      # load native binding" on first real launch). ELECTRON_RUN_AS_NODE
      # runs the packaged Electron binary's own bundled Node runtime
      # headlessly (no window, no display server needed).
      #
      # Requires through `app.asar`, NOT `app.asar.unpacked`, on purpose:
      # the real app does `require('better-sqlite3-multiple-ciphers')` as a
      # bare specifier from inside the packed asar, which Node then resolves
      # by walking node_modules *inside the asar virtual filesystem* (Electron
      # transparently redirects the individual unpacked .node file as it reads
      # it). Requiring the unpacked path directly — the first version of this
      # check — skips that resolution walk entirely and can pass even when the
      # real app-launch require chain is broken.
      #
      # Only better-sqlite3-multiple-ciphers remains native. Password hashing
      # moved to hash-wasm (pure WebAssembly, no .node) precisely because the
      # native @node-rs/argon2 binary loaded on the CI runner yet threw
      # "Failed to load native binding" on clean Windows machines that lack its
      # MSVC runtime — a failure no runner-side check can catch (SOU-86).
      - name: Verify native modules load in packaged app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd "apps/desktop/dist/${{ matrix.appDir }}"
          ELECTRON_RUN_AS_NODE=1 "./Centre Soutien.app/Contents/MacOS/Centre Soutien" -e "
            require('./Centre Soutien.app/Contents/Resources/app.asar/node_modules/better-sqlite3-multiple-ciphers');
            console.log('native modules OK');
          "

      - name: Verify native modules load in packaged app (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd apps/desktop/dist/win-unpacked
          ELECTRON_RUN_AS_NODE=1 "./Centre Soutien.exe" -e "
            require('./resources/app.asar/node_modules/better-sqlite3-multiple-ciphers');
            console.log('native modules OK');
          "

      - uses: actions/upload-artifact@v4
        with:
          name: centre-soutien-${{ matrix.artifact }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.exe
          retention-days: 14
          if-no-files-found: error

  # SOU-248: flip the draft release created by init-release to published once
  # every matrix runner has uploaded its assets.
  finalize-release:
    if: inputs.publish
    needs: [init-release, package]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.CS_RELEASES_TOKEN }}
    steps:
      - name: Publish draft release
        run: |
          VERSION="${{ needs.init-release.outputs.version }}"
          if gh release view "v$VERSION" --repo soufelhanafi/centresoutien-releases >/dev/null 2>&1; then
            gh release edit "v$VERSION" --draft=false --repo soufelhanafi/centresoutien-releases
          fi
