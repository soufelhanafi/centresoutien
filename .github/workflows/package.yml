name: Package

# Manual only — installers are heavy artifacts and this ticket (SOU-86) ships
# self-signed dev builds for controlled demo installs, not a public release
# channel. Each OS/arch builds on its own runner because better-sqlite3-
# multiple-ciphers and @node-rs/argon2 are native modules: their compiled
# binaries are only correct for the OS/arch that built them, so a single
# machine cannot cross-produce a working installer (see PACKAGING.md).
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub Release to centresoutien-releases (auto-update feed)'
        type: boolean
        default: false

jobs:
  # SOU-248: serialize release creation. One job creates the tag + draft
  # release so the three matrix runners never race a concurrent POST /releases
  # (loser gets 422 "Published releases must have a valid tag"). electron-builder
  # uploads assets to the existing draft; finalize-release publishes it.
  init-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve app version
        id: version
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create draft release (publish only)
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.CS_RELEASES_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if ! gh release view "v$VERSION" --repo soufelhanafi/centresoutien-releases >/dev/null 2>&1; then
            gh release create "v$VERSION" --draft --repo soufelhanafi/centresoutien-releases
          fi

  package:
    needs: init-release
    strategy:
      # Each OS artifact is independent — a Windows-only native-module flake
      # must never cancel the already-succeeding macOS build mid-run.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac:arm64
            artifact: macos-arm64-dmg
            appDir: mac-arm64
          - os: macos-15-intel
            script: dist:mac:x64
            artifact: macos-x64-dmg
            appDir: mac
          - os: windows-latest
            script: dist:win
            artifact: windows-x64-nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.9.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      # Windows Defender's real-time scan can hold a lock on a freshly-built
      # native .node binary just long enough for node-gyp's rebuild unlink to
      # hit EPERM — a well-known node-gyp/electron-rebuild flake on
      # windows-latest runners. Excluding the workspace avoids the race.
      - name: Exclude workspace from Windows Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"

      - run: pnpm install --frozen-lockfile

      - name: Package (${{ matrix.artifact }})
        env:
          GH_TOKEN: ${{ inputs.publish && secrets.CS_RELEASES_TOKEN || '' }}
        run: pnpm --filter @centresoutien/desktop ${{ matrix.script }} --publish ${{ inputs.publish && 'always' || 'never' }}

      # A green `electron-builder` exit code only proves packaging didn't
      # throw — it does NOT prove the native modules it bundled actually
      # load (SOU-86: @node-rs/argon2 packaged fine but threw "Failed to
      # load native binding" on first real launch). ELECTRON_RUN_AS_NODE
      # runs the packaged Electron binary's own bundled Node runtime
      # headlessly (no window, no display server needed).
      #
      # Requires through `app.asar`, NOT `app.asar.unpacked`, on purpose:
      # the real app does `require('better-sqlite3-multiple-ciphers')` as a
      # bare specifier from inside the packed asar, which Node then resolves
      # by walking node_modules *inside the asar virtual filesystem* (Electron
      # transparently redirects the individual unpacked .node file as it reads
      # it). Requiring the unpacked path directly — the first version of this
      # check — skips that resolution walk entirely and can pass even when the
      # real app-launch require chain is broken.
      #
      # Only better-sqlite3-multiple-ciphers remains native. Password hashing
      # moved to hash-wasm (pure WebAssembly, no .node) precisely because the
      # native @node-rs/argon2 binary loaded on the CI runner yet threw
      # "Failed to load native binding" on clean Windows machines that lack its
      # MSVC runtime — a failure no runner-side check can catch (SOU-86).
      - name: Verify native modules load in packaged app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd "apps/desktop/dist/${{ matrix.appDir }}"
          ELECTRON_RUN_AS_NODE=1 "./Centre Soutien.app/Contents/MacOS/Centre Soutien" -e "
            require('./Centre Soutien.app/Contents/Resources/app.asar/node_modules/better-sqlite3-multiple-ciphers');
            console.log('native modules OK');
          "

      - name: Verify native modules load in packaged app (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd apps/desktop/dist/win-unpacked
          ELECTRON_RUN_AS_NODE=1 "./Centre Soutien.exe" -e "
            require('./resources/app.asar/node_modules/better-sqlite3-multiple-ciphers');
            console.log('native modules OK');
          "

      - uses: actions/upload-artifact@v4
        with:
          name: centre-soutien-${{ matrix.artifact }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.exe
          retention-days: 14
          if-no-files-found: error

  # SOU-248: flip the draft release created by init-release to published once
  # every matrix runner has uploaded its assets.
  finalize-release:
    if: inputs.publish
    needs: [init-release, package]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.CS_RELEASES_TOKEN }}
    steps:
      - name: Publish draft release
        run: |
          VERSION="${{ needs.init-release.outputs.version }}"
          if gh release view "v$VERSION" --repo soufelhanafi/centresoutien-releases >/dev/null 2>&1; then
            gh release edit "v$VERSION" --draft=false --repo soufelhanafi/centresoutien-releases
          fi
