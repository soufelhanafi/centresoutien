name: Package

# Manual only — installers are heavy artifacts and this ticket (SOU-86) ships
# self-signed dev builds for controlled demo installs, not a public release
# channel. Each OS builds on its own runner because better-sqlite3-multiple-
# ciphers and @node-rs/argon2 are native modules: their compiled binaries are
# only correct for the OS/arch that built them, so a single machine cannot
# cross-produce a working Windows installer from macOS (see PACKAGING.md).
on:
  workflow_dispatch:

jobs:
  package:
    strategy:
      # Each OS artifact is independent — a Windows-only native-module flake
      # must never cancel the already-succeeding macOS build mid-run.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            artifact: dmg
          - os: windows-latest
            script: dist:win
            artifact: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.9.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      # Windows Defender's real-time scan can hold a lock on a freshly-built
      # native .node binary just long enough for node-gyp's rebuild unlink to
      # hit EPERM — a well-known node-gyp/electron-rebuild flake on
      # windows-latest runners. Excluding the workspace avoids the race.
      - name: Exclude workspace from Windows Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"

      - run: pnpm install --frozen-lockfile

      - name: Package (${{ matrix.artifact }})
        run: pnpm --filter @centresoutien/desktop ${{ matrix.script }}

      # A green `electron-builder` exit code only proves packaging didn't
      # throw — it does NOT prove the native modules it bundled actually
      # load (SOU-86: @node-rs/argon2 packaged fine but threw "Failed to
      # load native binding" on first real launch). ELECTRON_RUN_AS_NODE
      # runs the packaged Electron binary's own bundled Node runtime
      # headlessly (no window, no display server needed) so this requires
      # the exact ABI the shipped app will use, straight out of
      # app.asar.unpacked — the same path resolution a real launch hits.
      - name: Verify native modules load in packaged app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd apps/desktop/dist/mac-arm64
          ELECTRON_RUN_AS_NODE=1 "./Centre Soutien.app/Contents/MacOS/Centre Soutien" -e "
            require('./Centre Soutien.app/Contents/Resources/app.asar.unpacked/node_modules/better-sqlite3-multiple-ciphers');
            require('./Centre Soutien.app/Contents/Resources/app.asar.unpacked/node_modules/@node-rs/argon2');
            console.log('native modules OK');
          "

      - name: Verify native modules load in packaged app (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd apps/desktop/dist/win-unpacked
          ELECTRON_RUN_AS_NODE=1 "./Centre Soutien.exe" -e "
            require('./resources/app.asar.unpacked/node_modules/better-sqlite3-multiple-ciphers');
            require('./resources/app.asar.unpacked/node_modules/@node-rs/argon2');
            console.log('native modules OK');
          "

      - uses: actions/upload-artifact@v4
        with:
          name: centre-soutien-${{ matrix.artifact }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.exe
          retention-days: 14
          if-no-files-found: error
